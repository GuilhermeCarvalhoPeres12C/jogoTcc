<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>INTELLICART – Rebelião no Mercado</title>
<style>
html,body{margin:0;height:100%;background:#253326;overflow:hidden;font-family:system-ui,sans-serif;touch-action:none;user-select:none}
#wrap{height:100%;display:flex;align-items:center;justify-content:center}
canvas{width:min(100vw,calc(100vh*16/9));aspect-ratio:16/9;background:#EDE2C4;display:block}
.pad{position:fixed;bottom:14px;display:none;gap:10px}
.pad button{width:68px;height:68px;border-radius:50%;border:2px solid #C3CF5A;background:#253326cc;color:#EDE2C4;font-size:26px}
#pl{left:14px}#pr{right:14px}
#mu{position:fixed;top:10px;right:10px;width:40px;height:40px;border-radius:50%;border:2px solid #C3CF5A;background:#253326cc;color:#EDE2C4;font-size:18px;cursor:pointer;z-index:5}
#pa{position:fixed;top:10px;right:58px;width:40px;height:40px;border-radius:50%;border:2px solid #C3CF5A;background:#253326cc;color:#EDE2C4;font-size:18px;cursor:pointer;z-index:5}
@media (pointer:coarse){.pad{display:flex}}
</style>
</head>
<body>
<button id="mu" title="Som (M)">🔊</button>
<button id="pa" title="Pausar (P ou Esc)">⏸</button>
<div id="wrap"><canvas id="c" width="800" height="450"></canvas></div>
<div class="pad" id="pl"><button data-k="l">◀</button><button data-k="r">▶</button></div>
<div class="pad" id="pr"><button data-k="s">📷</button><button data-k="j">⬆</button></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=800,H=450,LW=3200,GY=390;
const EF='"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
let AC,OUT,muted=false,musT=0,nT=0,stp=0;
function ac(){if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();OUT=AC.createGain();OUT.gain.value=muted?0:1;OUT.connect(AC.destination)}if(AC.state==='suspended')AC.resume();return AC}
function tone(f,t0,d,ty,v){const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(g);g.connect(OUT);o.start(t0);o.stop(t0+d+.02)}
function beep(f,d=.08,ty='square',v=.04){try{ac();tone(f,AC.currentTime,d,ty,v)}catch(e){}}
function toggleMute(){muted=!muted;menuAudio.muted=muted;if(OUT)OUT.gain.value=muted?0:1;document.getElementById('mu').textContent=muted?'🔇':'🔊'}
document.getElementById('mu').addEventListener('click',e=>{e.stopPropagation();toggleMute();e.target.blur()});
document.getElementById('pa').addEventListener('click',e=>{e.stopPropagation();togglePause();e.target.blur()});
addEventListener('blur',()=>{if(state==='play')togglePause()});
const mf=n=>440*Math.pow(2,(n-69)/12);
const MU=[
 {r:48,t:.17,s:[0,2,4,7,9,12],b:[0,0,7,0,5,5,7,5],m:[0,-1,2,4,-1,4,2,-1,0,-1,2,4,5,4,2,-1]},
 {r:50,t:.15,s:[0,3,5,7,10,12],b:[0,0,3,0,5,5,3,0],m:[0,2,-1,3,4,-1,3,2,0,-1,2,3,5,-1,4,3]},
 {r:45,t:.13,s:[0,1,4,5,7,8],b:[0,0,0,1,0,0,5,4],m:[0,-1,0,3,-1,4,3,-1,2,-1,3,4,5,4,3,-1]},
 {r:52,t:.14,s:[0,2,4,7,9,12],b:[0,4,5,0,0,4,7,5],m:[4,-1,3,2,3,-1,5,4,2,-1,3,4,2,0,-1,1]}];
function sched(){if(!AC)return;if(menuOK)return;const m=MU[lv]||MU[0];if(nT<AC.currentTime)nT=AC.currentTime+.05;
 while(nT<AC.currentTime+.3){const d=m.t*((boss&&boss.on&&state==='play')?.8:1),i=stp%16;
  if(i%2===0)tone(mf(m.r-12+m.b[i/2]),nT,d*1.8,'triangle',.07);
  if(i%4===0)tone(70,nT,.12,'sine',.12);
  if(m.m[i]>=0)tone(mf(m.r+12+m.s[m.m[i]]),nT,d*.9,'square',.03);
  nT+=d;stp++}}
// Música do menu: coloque o arquivo sunflower.mp3 na mesma pasta deste HTML. Volume de 0 a 1.
const menuAudio=new Audio('sunflower.mp3');menuAudio.loop=true;menuAudio.volume=.25;menuAudio.preload='auto';let menuOK=false,menuErr=false;
menuAudio.autoplay=true;
menuAudio.addEventListener('canplay',()=>{menuOK=true;if(menuAudio.paused)menuAudio.play().catch(()=>{})});
menuAudio.addEventListener('error',()=>{menuErr=true});
function togglePause(){if(state==='play'){state='pause';for(const k in K)K[k]=0}else if(state==='pause')state='play'}
function toMenu(){state='title';lv=0;L=LV[0];snap={got:[],total:0,kg:0};init();lock=0}
function musicOn(){try{ac();if(!musT)musT=setInterval(sched,80);if(menuOK&&menuAudio.paused)menuAudio.play().catch(()=>{})}catch(e){}}

// ---------- entrada ----------
const K={},KM={ArrowLeft:'l',a:'l',A:'l',ArrowRight:'r',d:'r',D:'r',ArrowUp:'j',w:'j',W:'j',' ':'j'};
addEventListener('keydown',e=>{musicOn();if(e.key==='m'||e.key==='M')toggleMute();const k=KM[e.key];if(k){K[k]=1;e.preventDefault()}if(e.key==='Escape'||e.key==='p'||e.key==='P')togglePause();if((e.key==='Enter'||e.key===' ')&&state!=='play'){if(state==='pause')state='play';else start()}});
addEventListener('keyup',e=>{const k=KM[e.key];if(k)K[k]=0});
document.querySelectorAll('[data-k]').forEach(b=>{const k=b.dataset.k;
  b.addEventListener('pointerdown',e=>{e.preventDefault();K[k]=1;if(state!=='play'&&state!=='pause')start()});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>K[k]=0))});
let mx=0,my=0,hov=0;const BX=300,BY=182,BW=200,BH=52;
function mpos(e){const r=cv.getBoundingClientRect();mx=(e.clientX-r.left)*W/r.width;my=(e.clientY-r.top)*H/r.height}
cv.addEventListener('pointermove',e=>{mpos(e);hov=mx>=BX&&mx<=BX+BW&&my>=BY&&my<=BY+BH});
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{musicOn();mpos(e);
  if(state==='pause'){if(mx>=300&&mx<=500){if(my>=170&&my<=222)state='play';else if(my>=240&&my<=292)toMenu()}return}
  if(state==='play'){if(e.pointerType==='mouse'&&e.button===0)K.s=1;return}
  if(state==='title'){if(mx>=BX&&mx<=BX+BW&&my>=BY&&my<=BY+BH)start()}else start()});
addEventListener('pointerup',e=>{if(e.pointerType==='mouse'&&e.button===0)K.s=0});

// ---------- dados ----------
const LV=[
{n:'Mercearia',sky:'#EDE2C4',wall:'#dccfa6',shelf:'#b9a97c',pal:['#c0392b','#2e86c1','#d4ac0d','#27ae60','#8e44ad','#e67e22'],sg:['ENLATADOS','GRÃOS','BEBIDAS'],
 cat:[['🍚','Arroz 5kg',24.9,5],['🫘','Feijão 1kg',8.5,1],['🥛','Leite 1L',5.2,1],['🍝','Macarrão 500g',4.8,.5],['🍪','Biscoito',3.5,.2],['☕','Café 500g',17.9,.5],['🧂','Açúcar 1kg',4.9,1],['🥤','Refrigerante 2L',9.9,2]],
 en:['🥫','🍞','🧃','🍌','🧀'],boss:{e:'👹',c:'👑',n:'REI DAS PROMOÇÕES',hp:25,atk:'aim',sh:'🏷️'},
 wp:{n:'produtos arremessados',k:0,cd:14,sp:9,l:80,dm:1}},
{n:'Limpeza',sky:'#D6ECF2',wall:'#B7DCE6',shelf:'#8fb8c4',pal:['#2e86c1','#16a085','#f1c40f','#e84393','#1abc9c','#3498db'],sg:['DETERGENTES','SABÕES','DESINFETANTES'],
 cat:[['🧴','Detergente',2.9,.5],['🧼','Sabão em barra',1.8,.2],['🧻','Papel higiênico',12.9,.4],['🧹','Vassoura',14.9,.8]],
 en:['🦠','🪣','🐜','🧫','🧯'],boss:{e:'🧽',c:'☣️',n:'ESPONJA TÓXICA',hp:40,atk:'bubble',sh:'🫧'},
 wp:{n:'spray de limpeza (curto alcance, rápido)',k:1,e:'💦',cd:6,sp:10,l:40,dm:1}},
{n:'Açougue',sky:'#EBD3CF',wall:'#D9B3AD',shelf:'#b98a84',pal:['#c0392b','#e74c3c','#922b21','#f5b7b1','#7b241c','#cd6155'],sg:['BOVINOS','AVES','EMBUTIDOS'],
 cat:[['🥩','Bife 1kg',39.9,1],['🍗','Frango 1kg',16.9,1],['🌭','Linguiça 500g',12.5,.5],['🥓','Bacon 250g',14.9,.25]],
 en:['🐖','🐄','🐓','🐟','🦴'],boss:{e:'🐂',c:'🔪',n:'TOURO AÇOUGUEIRO',hp:36,atk:'charge',sh:'🥩'},
 wp:{n:'faca (lenta, dano triplo)',k:2,e:'🔪',cd:26,sp:8,l:90,dm:3}},
{n:'Padaria',sky:'#F3E1B5',wall:'#E6C98C',shelf:'#c99a5b',pal:['#d68910','#b9770e','#f5cba7','#a04000','#e59866','#f8c471'],sg:['PÃES','BOLOS','DOCES'],
 cat:[['🥐','Croissant',6.5,.1],['🎂','Bolo',22,1],['🍞','Pão de forma',7.5,.5],['🍰','Fatia de torta',8,.2]],
 en:['🍩','🧁','🥨','🍪'],boss:{e:'🧑‍🍳',c:'🔥',n:'PADEIRO PIROMANÍACO',hp:45,atk:'fire',sh:'🥐'},
 wp:{n:'baguetes (tiro triplo)',k:3,e:'🥖',cd:22,sp:8,l:70,dm:1}}];
let lv=0,L=LV[0],snap={got:[],total:0,kg:0};
const P=[[0,GY,LW],[300,310,120],[520,260,120],[760,310,140],[1000,250,120],[1220,300,150],[1450,240,120],[1650,300,140],[1900,260,130],[2150,310,140]];
let state='title',lock=0,lockL=0,t=0,cam=0;
let pl,en,sh,bs,items,boss,got,total,kg;

function init(){
  pl={x:60,y:GY-36,w:30,h:36,vx:0,vy:0,on:0,f:1,inv:0,hp:3,cd:0};
  got=snap.got.slice();total=snap.total;kg=snap.kg;cam=0;lockL=0;sh=[];bs=[];t=0;
  items=[];
  for(let i=0;i<16;i++){const x=220+i*150;let y=GY;
    for(const p of P)if(p[1]<y&&x>p[0]-10&&x<p[0]+p[2]-20)y=p[1];
    items.push({x,y:y-34,w:30,h:30,c:L.cat[i%L.cat.length]})}
  en=[[600,500,720,GY],[900,850,1100,GY],[1150,1060,1300,GY],[790,760,870,310],[1040,1000,1090,250],[1500,1400,1650,GY],[1700,1650,1760,300],[1950,1900,2000,260],[2050,1950,2150,GY],[2200,2150,2260,310],[2350,2250,2450,GY]]
    .map(([x,a,b,y],i)=>({x,a,b,y:y-34,w:30,h:34,d:i%2?1:-1,e:L.en[i%L.en.length],dead:0}));
  boss={x:3000,y:GY-96,w:96,h:96,hp:L.boss.hp,max:L.boss.hp,d:-1,cd:90,fl:0,on:0,dead:0,t:90,k:0,warn:0,dash:0};
}
function start(){musicOn();if(lock>0)return;
  if(state==='title'||state==='win'){lv=0;snap={got:[],total:0,kg:0}}
  else if(state==='next'){lv++;snap={got:got.slice(),total,kg}}
  L=LV[lv];init();state='play';beep(440,.1)}
init();

const ov=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function hurt(){if(pl.inv>0||boss.dead)return;pl.hp--;pl.inv=90;pl.vy=-7;beep(120,.25,'sawtooth');if(pl.hp<=0){state='over';lock=40}}

// ---------- lógica ----------
function upd(){
  t++;
  const ax=(K.r?1:0)-(K.l?1:0);pl.vx=ax*3.4;if(ax)pl.f=ax;
  if(K.j&&pl.on){pl.vy=-12.5;pl.on=0;beep(520,.1)}
  pl.vy=Math.min(14,pl.vy+.6);
  pl.x=Math.max(lockL,Math.min(LW-pl.w,pl.x+pl.vx));
  const prev=pl.y+pl.h;pl.y+=pl.vy;pl.on=0;
  if(pl.vy>=0)for(const p of P){if(pl.x+pl.w>p[0]&&pl.x<p[0]+p[2]&&prev<=p[1]+1&&pl.y+pl.h>=p[1]){pl.y=p[1]-pl.h;pl.vy=0;pl.on=1;break}}
  pl.inv--;pl.cd--;
  if(K.s&&pl.cd<=0){const w=L.wp,n=w.k===3?3:1;for(let i=0;i<n;i++)sh.push({x:pl.x+(pl.f>0?pl.w:-22),y:pl.y+6,w:24,h:24,vx:pl.f*w.sp,vy:(i-(n-1)/2)*1.6,l:w.l,r:0,dm:w.dm,e:w.k===0?(got.length?got[Math.floor(Math.random()*got.length)][0]:'🥫'):w.e});pl.cd=w.cd;beep(w.k===1?1200:880,.05)}

  // chefe ativa quando o jogador chega perto
  if(!boss.on&&pl.x>2450){boss.on=1;lockL=2400;beep(90,.5,'sawtooth',.06)}
  cam=Math.max(0,Math.min(LW-W,pl.x-W/2));

  // tiros do jogador
  for(const s of sh){s.x+=s.vx;s.y+=s.vy||0;s.l--;
    for(const e of en)if(!e.dead&&ov(s,e)){e.dead=1;s.l=0;beep(300,.1)}
    for(const b of bs)if(b.l>0&&s.l>0&&ov(s,b)){b.l=0;s.l=0;beep(500,.06,'triangle',.06)}
    if(boss.on&&!boss.dead&&ov(s,boss)){boss.hp-=s.dm;boss.fl=5;s.l=0;beep(180,.06,'square',.05);
      if(boss.hp<=0){boss.dead=1;bs=[];beep(80,.8,'sawtooth',.06)}}}
  sh=sh.filter(s=>s.l>0);

  // inimigos (produtos com perninhas)
  for(const e of en){if(e.dead)continue;e.x+=e.d*1.1;if(e.x<e.a||e.x>e.b)e.d*=-1;
    if(ov(pl,e)){if(pl.vy>0&&prev<=e.y+14){e.dead=1;pl.vy=-9;beep(660,.1)}else hurt()}}
  en=en.filter(e=>!e.dead);

  // itens
  for(const it of items)if(!it.got&&ov(pl,it)){it.got=1;got.push(it.c);total+=it.c[2];kg+=it.c[3];beep(1000,.06,'sine',.06);setTimeout(()=>beep(1400,.08,'sine',.06),60)}

  // chefe
  const B=L.boss;
  if(boss.on&&!boss.dead){
    const half=boss.hp<boss.max/2;
    if(boss.fl>0)boss.fl--;
    if(boss.warn>0){if(--boss.warn===0)boss.dash=pl.x<boss.x?-1:1}
    else if(boss.dash){boss.x+=boss.dash*(half?7:5.5);if(boss.x<2430||boss.x>3090){boss.x=Math.max(2430,Math.min(3090,boss.x));boss.dash=0}}
    else{boss.x+=boss.d*(half?2:1.3);if(boss.x<2780)boss.d=1;else if(boss.x>3090)boss.d=-1}
    if(--boss.cd<=0){
      const bx=boss.x+48,by=boss.y+40,dx=pl.x+15-bx,dy=pl.y+18-by,ang=Math.atan2(dy,dx);
      const mk=(a,sp)=>bs.push({x:bx,y:by,w:22,h:22,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,l:240,e:B.sh});
      boss.k^=1;boss.cd=half?60:95;
      if(B.atk==='aim'){const n=half?3:1;for(let i=0;i<n;i++)mk(ang+(i-(n-1)/2)*.28,4.2)}
      else if(B.atk==='bubble'){boss.cd=half?85:130;for(let i=0;i<(half?2:1);i++){const y0=by-30+i*50;bs.push({x:bx,y:y0,y0,w:24,h:24,vx:-2.2-i*.3,vy:0,l:360,e:B.sh,wv:1,ph:i*2})}}
      else if(B.atk==='charge'){if(boss.k)boss.warn=40;else bs.push({x:bx,y:by,w:24,h:24,vx:dx/70,vy:-7,g:.2,l:200,e:B.sh})}
      else{const n=half?3:1;for(let i=0;i<n;i++)mk(ang+(i-(n-1)/2)*.3,4);for(let i=0;i<(half?3:2);i++)bs.push({x:2420+Math.random()*730,y:40,w:24,h:30,vx:0,vy:3.5,l:140,e:'🔥'})}
      beep(250,.15,'sawtooth')}
    if(ov(pl,boss))hurt();
  }
  for(const b of bs){if(b.l<=0)continue;if(b.g)b.vy+=b.g;b.x+=b.vx;if(b.wv)b.y=b.y0+Math.sin((t+b.ph*20)/14)*55;else b.y+=b.vy;b.l--;if(b.y>H)b.l=0;if(ov(pl,b)){b.l=0;hurt()}}
  bs=bs.filter(b=>b.l>0);
  if(boss.dead&&--boss.t<=0){state=lv<LV.length-1?'next':'win';lock=60;beep(880,.2);setTimeout(()=>beep(1100,.3),200)}
}

// ---------- desenho ----------
function E(e,cx,bottom,s){ctx.font=s+'px '+EF;ctx.textAlign='center';ctx.textBaseline='bottom';ctx.fillText(e,cx,bottom)}
const COL=['#c0392b','#2e86c1','#d4ac0d','#27ae60','#8e44ad','#e67e22'];
function bg(){
  ctx.fillStyle=L.sky;ctx.fillRect(0,0,W,H);
  ctx.fillStyle=L.wall;ctx.fillRect(0,0,W,70);
  for(let i=0;i<9;i++){const x=((i*130-cam*.3)%1170+1170)%1170-70;ctx.fillStyle='#fff9dc';ctx.fillRect(x,22,64,8)}
  const off=cam*.5,n0=Math.floor(off/170);
  for(let i=-1;i<6;i++){const x=i*170-(off%170),n=n0+i;
    ctx.fillStyle=L.shelf;ctx.fillRect(x,130,140,260);
    for(let r=0;r<4;r++){ctx.fillStyle='#8d7d55';ctx.fillRect(x,165+r*55,140,5);
      for(let c=0;c<5;c++){ctx.fillStyle=L.pal[(n*3+r*5+c)%6];ctx.fillRect(x+8+c*26,135+r*55+(c*7%9),20,25-(c*7%9))}}}
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function pauseScr(){ctx.fillStyle='#181303d9';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.textBaseline='alphabetic';
  ctx.fillStyle='#C3CF5A';ctx.font='bold 48px system-ui';ctx.fillText('PAUSADO',W/2,130);
  [['▶ Continuar',170],['⌂ Menu inicial',240]].forEach(([tx,y])=>{const h=mx>=300&&mx<=500&&my>=y&&my<=y+52;ctx.fillStyle=h?'#e2ee7a':'#C3CF5A';rr(300,y,200,52,14);ctx.fill();ctx.fillStyle='#1F4400';ctx.font='bold 22px system-ui';ctx.fillText(tx,W/2,y+34)});
  ctx.fillStyle='#EDE2C4';ctx.font='14px system-ui';ctx.fillText('ESC ou P: continuar   ·   M: som',W/2,330)}
function titleScr(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1F4400');g.addColorStop(1,'#253326');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const em=['🥫','🍞','🧴','🥩','🥐','🍚','🧼','🍗'];
  ctx.globalAlpha=.3;ctx.fillStyle='#000';
  for(let i=0;i<14;i++){const x=(i*97+t*(.4+i%3*.2))%(W+60)-30,y=70+((i*53)%260)+Math.sin(t/30+i)*12;E(em[i%8],x,y,34)}
  ctx.globalAlpha=1;
  ctx.fillStyle='#181303';ctx.fillRect(0,404,W,46);ctx.fillStyle='#C3CF5A';ctx.fillRect(0,400,W,4);
  ['👹','🧽','🐂','🧑‍🍳'].forEach((b,i)=>{ctx.fillStyle='#000';E(b,250+i*100,400,46)});
  ctx.fillStyle='#000';E('🛒',((t*2.4)%(W+120))-60,400-Math.abs(Math.sin(t/9))*8,44);
  ctx.textAlign='center';ctx.textBaseline='alphabetic';
  ctx.font='bold 66px system-ui';ctx.fillStyle='#181303';ctx.fillText('INTELLICART',W/2+4,114);ctx.fillStyle='#C3CF5A';ctx.fillText('INTELLICART',W/2,110);
  ctx.fillStyle='#EDE2C4';ctx.font='italic 22px system-ui';ctx.fillText('Rebelião no Mercado',W/2,148);
  const p=hov?4:Math.sin(t/12)*2;ctx.fillStyle='#181303';rr(BX-p+3,BY-p/2+4,BW+2*p,BH+p,14);ctx.fill();
  ctx.fillStyle=hov?'#e2ee7a':'#C3CF5A';rr(BX-p,BY-p/2,BW+2*p,BH+p,14);ctx.fill();
  ctx.fillStyle='#1F4400';ctx.font='bold 26px system-ui';ctx.fillText('▶ JOGAR',W/2,BY+34);
  ctx.fillStyle='#EDE2C4';ctx.font='15px system-ui';
  ctx.fillText('← → ou A D: mover   ·   ↑, W ou espaço: pular   ·   botão esquerdo do mouse: atirar',W/2,268);
  ctx.fillText('4 seções: Mercearia, Limpeza, Açougue e Padaria. Colete os produtos e derrote cada chefe!',W/2,292);
  ctx.fillStyle='#C3CF5A';ctx.font='13px system-ui';ctx.fillText('Clique em JOGAR ou aperte ENTER  ·  P pausa  ·  M liga/desliga o som',W/2,322);
  if(!menuErr&&menuOK&&menuAudio.paused&&!muted){ctx.fillStyle='#EDE2C4';ctx.font='13px system-ui';ctx.fillText('🔊 Clique ou aperte qualquer tecla para ativar a música',W/2,345)}
}
function draw(){
  if(state==='title'){titleScr();return}
  bg();
  ctx.save();ctx.translate(-Math.round(cam),0);
  for(const [x,txt] of [[380,L.sg[0]],[1180,L.sg[1]],[1980,L.sg[2]],[2620,'ARENA DO CHEFE']]){ctx.fillStyle='#253326';ctx.fillRect(x-70,70,140,26);ctx.fillStyle='#C3CF5A';ctx.font='bold 13px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(txt,x,83)}
  for(const p of P){
    if(p[1]===GY){ctx.fillStyle='#253326';ctx.fillRect(p[0],GY,p[2],H-GY);ctx.fillStyle='#C3CF5A';ctx.fillRect(p[0],GY,p[2],4)}
    else{ctx.fillStyle='#6b4f2a';ctx.fillRect(p[0],p[1],p[2],12);ctx.fillStyle='#9F8F67';ctx.fillRect(p[0],p[1],p[2],4)}}
  ctx.fillStyle='#000';
  for(const it of items)if(!it.got)E(it.c[0],it.x+15,it.y+32+Math.sin(t/14+it.x)*3,28);
  for(const e of en){E(e.e,e.x+15,e.y+26,28);
    const s=Math.floor(t/8)%2;ctx.strokeStyle='#181303';ctx.lineWidth=3;ctx.beginPath();
    ctx.moveTo(e.x+10,e.y+26);ctx.lineTo(e.x+10+(s?-3:3),e.y+34);ctx.moveTo(e.x+20,e.y+26);ctx.lineTo(e.x+20+(s?3:-3),e.y+34);ctx.stroke()}
  for(const s of sh){s.r+=.35*Math.sign(s.vx);ctx.save();ctx.translate(s.x+12,s.y+12);ctx.rotate(s.r);ctx.fillStyle='#000';E(s.e,0,12,26);ctx.restore()}
  if(boss.on&&boss.hp===boss.max&&!bs.length&&state==='play'){ctx.fillStyle='#181303';ctx.font='bold 16px system-ui';ctx.textAlign='center';ctx.fillText('Botão esquerdo do mouse para atirar: '+L.wp.n+'!',cam+W/2,60)}
  if(!(pl.inv>0&&(pl.inv>>2)&1)){ctx.save();ctx.translate(pl.x+15,0);if(pl.f<0)ctx.scale(-1,1);ctx.fillStyle='#000';E('🛒',0,pl.y+pl.h+4,40);ctx.restore()}
  if(boss.on||state==='title'){
    if(!boss.dead||(t>>2)%2){ctx.globalAlpha=boss.fl>0||(boss.warn>0&&(t>>2)%2)?.45:1;ctx.fillStyle='#000';E(L.boss.e,boss.x+48,boss.y+96,92);E(L.boss.c,boss.x+48,boss.y+22,38);ctx.globalAlpha=1}}
  for(const b of bs){ctx.fillStyle='#000';E(b.e,b.x+11,b.y+24,24)}
  ctx.restore();
  hud();
  if(state==='title')screen('INTELLICART','Os produtos do mercado se rebelaram!','4 seções: Mercearia, Limpeza, Açougue e Padaria. Cada uma tem um chefe e uma arma diferente.','← → mover   ↑ / espaço pular   X atirar   pular em cima dos inimigos também vale');
  if(state==='over')screen('Fim de jogo','O carrinho foi derrubado.','Itens no carrinho: '+got.length+' · R$ '+total.toFixed(2).replace('.',','),'');
  if(state==='pause')pauseScr();
  if(state==='next')screen('Seção concluída!','Próxima: '+LV[lv+1].n,'Arma nova: '+LV[lv+1].wp.n,'Vida do carrinho reabastecida.');
  if(state==='win')receipt();
}
function hud(){
  ctx.textBaseline='top';ctx.textAlign='left';ctx.fillStyle='#253326cc';ctx.fillRect(0,0,W,36);
  ctx.font='20px '+EF;ctx.fillStyle='#000';ctx.fillText('❤️'.repeat(Math.max(0,pl.hp))+'🖤'.repeat(3-Math.max(0,pl.hp)),10,6);
  ctx.font='bold 15px system-ui';ctx.fillStyle='#C3CF5A';
  ctx.fillText('Total R$ '+total.toFixed(2).replace('.',','),120,10);
  ctx.fillText('Peso '+kg.toFixed(1).replace('.',',')+' kg',265,10);
  ctx.fillText('Itens '+got.length,365,10);ctx.fillText('Fase '+(lv+1)+'/4 '+L.n,440,10);if(t<150&&state==='play'){ctx.textAlign='center';ctx.fillStyle='#181303';ctx.font='bold 20px system-ui';ctx.fillText('Fase '+(lv+1)+': '+L.n+' · arma: '+L.wp.n,W/2,100);ctx.textAlign='left'}
  if(boss.on){const w=240,x=W-w-12;ctx.fillStyle='#181303';ctx.fillRect(x-2,42,w+4,20);ctx.fillStyle='#c0392b';ctx.fillRect(x,44,w*Math.max(0,boss.hp)/boss.max,16);
    ctx.fillStyle='#fff';ctx.font='bold 11px system-ui';ctx.fillText(L.boss.n,x+6,47)}
}
function screen(a,b,c,d){
  ctx.fillStyle='#181303d9';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.textBaseline='alphabetic';
  ctx.fillStyle='#C3CF5A';ctx.font='bold 52px system-ui';ctx.fillText(a,W/2,150);
  ctx.fillStyle='#EDE2C4';ctx.font='20px system-ui';ctx.fillText(b,W/2,200);ctx.font='15px system-ui';ctx.fillText(c,W/2,235);ctx.fillText(d,W/2,265);
  ctx.fillStyle='#C3CF5A';ctx.font='bold 18px system-ui';if((t>>5)%2||state!=='title')ctx.fillText('Toque ou pressione ENTER para '+({title:'começar',next:'continuar'}[state]||'jogar de novo'),W/2,330);
  if(state==='title'){ctx.fillStyle='#000';E('🛒',W/2,400,60)}
}
function receipt(){
  ctx.fillStyle='#181303d9';ctx.fillRect(0,0,W,H);
  const x=250,w=300,y=8,h=434;ctx.fillStyle='#fffdf2';ctx.fillRect(x,y,w,h);
  ctx.fillStyle='#1F4400';ctx.textBaseline='top';ctx.textAlign='center';ctx.font='bold 16px "Courier New",monospace';
  ctx.fillText('INTELLICART',W/2,y+12);ctx.font='11px "Courier New",monospace';ctx.fillText('RECIBO DEMONSTRATIVO',W/2,y+32);ctx.fillText('Os 4 chefes foram derrotados!',W/2,y+48);
  const agg={};got.forEach(c=>{agg[c[1]]=agg[c[1]]||{n:0,p:c[2]};agg[c[1]].n++});
  let yy=y+78;ctx.textAlign='left';ctx.font='10px "Courier New",monospace';
  for(const k in agg){ctx.fillText(agg[k].n+'x '+k,x+14,yy);ctx.textAlign='right';ctx.fillText((agg[k].n*agg[k].p).toFixed(2).replace('.',','),x+w-14,yy);ctx.textAlign='left';yy+=12}
  ctx.fillRect(x+14,yy+6,w-28,1);yy+=18;ctx.font='bold 14px "Courier New",monospace';
  ctx.fillText('TOTAL R$',x+14,yy);ctx.textAlign='right';ctx.fillText(total.toFixed(2).replace('.',','),x+w-14,yy);
  ctx.textAlign='center';ctx.font='11px "Courier New",monospace';ctx.fillText('Peso total: '+kg.toFixed(1).replace('.',',')+' kg',W/2,yy+28);
  ctx.fillText('Sem valor fiscal - projeto acadêmico',W/2,yy+46);
  ctx.fillStyle='#1F4400';ctx.font='bold 13px system-ui';ctx.fillText('Toque ou ENTER para jogar de novo',W/2,y+h-26);
}

let last=0,acc=0;
function loop(ts){acc+=Math.min(100,ts-last);last=ts;
  while(acc>=16.67){acc-=16.67;if(lock>0)lock--;if(state==='play')upd();else t++}
  draw();cv.style.cursor=state==='play'?'crosshair':((state==='title'&&hov)||state==='pause'?'pointer':'default');requestAnimationFrame(loop)}
['pointerdown','touchstart','mousedown','click','keydown'].forEach(ev=>addEventListener(ev,musicOn,true));
musicOn();
requestAnimationFrame(loop);
</script>
